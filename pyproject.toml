[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marktplaats-suite"
dynamic = ["version"]
description = "Productmanager, fotomanager, barcode scanner en automater voor Marktplaats"
requires-python = ">=3.9"
dependencies = ["pillow", "python-barcode", "openpyxl", "python-docx", "Send2Trash",
                "brother_ql", "selenium", "requests"]

[project.optional-dependencies]
# achtergrond weghalen met AlphaMaker: licht (IS-Net via onnxruntime), medium (InSPyReNet via
# transparent-background) en zwaar (BiRefNet via PyTorch: transformers<5, safetensors, einops)
ai = ["transparent-background", "opencv-python", "numpy", "tqdm", "psutil", "scipy", "onnxruntime",
      "transformers<5", "safetensors", "einops"]

[project.scripts]
marktplaats-suite = "marktplaats_suite.productmanager:main"

[tool.setuptools]
packages = ["marktplaats_suite", "marktplaats_suite.assets", "marktplaats_suite.alphamaker"]

[tool.setuptools.dynamic]
version = {attr = "marktplaats_suite.__version__"}

[tool.setuptools.package-data]
marktplaats_suite = ["assets/*"]
"marktplaats_suite.alphamaker" = ["LICENSE", "BRON.txt"]
