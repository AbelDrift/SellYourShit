name: Linux-installatie

# Test install.sh --met-ai en de app op de gangbare Linux-distributies (elk in een eigen container),
# en de Automater met Firefox en Chromium als snap (zoals op Ubuntu). Maakt geen release.
on:
  push:
    paths:
      - "install.sh"
      - "pyproject.toml"
      - "marktplaats_suite/**"
      - "linux/**"
      - "windows/test_windows.py"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distro:
    name: ${{ matrix.naam }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { naam: "Debian 12", image: "debian:12" }
          - { naam: "Debian 13", image: "debian:13" }
          - { naam: "Ubuntu 22.04", image: "ubuntu:22.04" }
          - { naam: "Ubuntu 24.04", image: "ubuntu:24.04" }
          - { naam: "Ubuntu 26.04", image: "ubuntu:26.04" }
          - { naam: "Ubuntu 26.10", image: "ubuntu:26.10" }
          - { naam: "Fedora", image: "fedora:latest" }
          - { naam: "Arch Linux", image: "archlinux:latest" }
          - { naam: "openSUSE Tumbleweed", image: "opensuse/tumbleweed:latest" }
    container:
      image: ${{ matrix.image }}
      options: --shm-size=2g
    steps:
      - name: Testgebruiker, sudo en Xvfb (wat een gewone desktop al heeft)
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y sudo xvfb procps git ca-certificates
          elif command -v dnf >/dev/null; then
            dnf install -y sudo xorg-x11-server-Xvfb procps-ng git
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm sudo xorg-server-xvfb procps-ng git
          elif command -v zypper >/dev/null; then
            # de container heeft busybox-gawk; een gewone openSUSE-desktop heeft gawk
            zypper --non-interactive install --force-resolution gawk
            zypper --non-interactive install sudo xorg-x11-server-Xvfb procps git shadow
          fi
          useradd -m tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          chmod 440 /etc/sudoers.d/tester

      - uses: actions/checkout@v4

      - name: install.sh --met-ai (als gewone gebruiker)
        run: |
          chown -R tester "$GITHUB_WORKSPACE"
          su - tester -c "cd '$GITHUB_WORKSPACE' && PIP_NO_CACHE_DIR=1 ./install.sh --met-ai" 2>&1 | tee /tmp/install.log
          grep -q "Klaar: SellYourShit" /tmp/install.log
          if grep -q "Zonder AI" /tmp/install.log; then echo "::error::AI-pakketten niet geïnstalleerd"; exit 1; fi

      - name: App starten, foto's verwerken (licht, medium, zwaar), product registreren
        run: |
          su - tester -c "Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 & sleep 3
            export DISPLAY=:99
            mkdir -p /tmp/leeg /tmp/uit
            ls ~/.local/share/marktplaats-suite/
            echo \"lettertypen: \$(fc-list : family | sort -u | tr '\\n' ';')\"
            test -x ~/.local/share/marktplaats-suite/ai-venv/bin/python && echo \"aparte AI-omgeving: \$(~/.local/share/marktplaats-suite/ai-venv/bin/python --version)\"
            ~/.local/share/marktplaats-suite/venv/bin/python '$GITHUB_WORKSPACE/windows/test_windows.py' /tmp/leeg /tmp/uit"

  snap:
    name: Automater met snap-Firefox en snap-Chromium (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install.sh (zonder AI) op de runner zelf
        run: ./install.sh
      - name: Firefox en Chromium als snap
        run: |
          sudo snap install firefox || sudo snap refresh firefox
          sudo snap install chromium || true
          ls -l /snap/bin/ | grep -E "firefox|chromium|geckodriver" || true
      - name: Automater starten met de snaps
        run: |
          sudo apt-get install -y xvfb >/dev/null
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:99 PATH="/snap/bin:$PATH" ~/.local/share/marktplaats-suite/venv/bin/python linux/test_snap.py
